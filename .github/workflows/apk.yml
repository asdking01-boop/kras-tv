name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
      - run: |
          mkdir -p www
          HTML_FILE=$(find . -maxdepth 3 -iname "*.html" | head -n 1)
          cp "$HTML_FILE" www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "KRAS FLIX" "com.krasflix.iptv" --web-dir www
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KRAS-FLIX-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
